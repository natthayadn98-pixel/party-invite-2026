<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การ์ดเชิญงานเลี้ยงสังสรรค์ 2569</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- โหลดไลบรารีสร้าง QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: url('https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
            font-family: 'Prompt', sans-serif;
        }
        body::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55); z-index: -1;
        }
        .envelope-wrapper {
            position: relative; width: 90%; max-width: 360px; height: 240px; cursor: pointer;
        }
        .envelope-back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #d8c8af; box-shadow: 0 15px 35px rgba(0,0,0,0.6); z-index: 1;
        }
        .paper-texture {
            background: linear-gradient(135deg, #f9f5ec 0%, #eaddc4 100%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .letter {
            position: absolute; top: -110px; left: 2.5%; width: 95%; height: 440px;
            background: #fffdf7; box-shadow: 0 15px 40px rgba(0,0,0,0.5); z-index: 0;
            padding: 20px; box-sizing: border-box; text-align: center; color: #333; border-radius: 6px;
            opacity: 0; transform: scale(0.5); pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .flap-left { position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: polygon(0 0, 50% 50%, 0 100%); z-index: 3; pointer-events: none; }
        .flap-right { position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: polygon(100% 0, 50% 50%, 100% 100%); z-index: 3; pointer-events: none; }
        .flap-bottom { position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: polygon(0 100%, 50% 45%, 100% 100%); z-index: 4; pointer-events: none; }
        
        .bottom-text {
            position: absolute; bottom: 25px; width: 100%; text-align: center;
            font-family: 'Cinzel', serif; font-style: italic; font-size: 11px; color: #7b1113; line-height: 1.5; z-index: 5; pointer-events: none; padding: 0 10px;
        }
        .flap-top {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            clip-path: polygon(0 0, 100% 0, 50% 60%); z-index: 6;
            transform-origin: top; transition: transform 0.5s ease-in-out;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        .top-text { padding-top: 30px; text-align: center; }
        .envelope-title { font-family: 'Cinzel', serif; font-size: 20px; color: #7b1113; font-weight: 700; margin-bottom: 2px; }
        .envelope-subtitle { font-size: 11px; color: #7b1113; }
        
        .wax-seal {
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background: radial-gradient(circle, #aa1318 0%, #5e080b 100%);
            border-radius: 50%; box-shadow: inset 0 0 8px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: center; color: #5a070c; font-size: 24px; z-index: 7; transition: opacity 0.3s;
        }
        .tap-hint {
            position: absolute; bottom: -35px; width: 100%; text-align: center; color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-size: 13px; opacity: 0.9; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } }

        .letter h2 { font-family: 'Cinzel', serif; color: #7b1113; margin: 0 0 5px 0; border-bottom: 1px solid #eaddc4; padding-bottom: 5px; font-size: 16px; }
        .letter-content { font-size: 12px; line-height: 1.4; text-align: left; color: #444; margin-bottom: 5px; }
        .letter-content strong { color: #7b1113; }
        
        input[type="text"] {
            width: 100%; padding: 8px; margin: 5px 0 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: 'Prompt', sans-serif; box-sizing: border-box;
        }
        .btn-action {
            display: block; background: #7b1113; color: #fffdf7; text-decoration: none; padding: 10px 0;
            border-radius: 4px; font-size: 14px; font-weight: 600; text-align: center; cursor: pointer; border: none; width: 100%; transition: background 0.3s;
        }
        .btn-action:hover { background: #5e080b; }

        .envelope-wrapper.open .flap-top { transform: rotateX(180deg); z-index: 1; }
        .envelope-wrapper.open .wax-seal { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        .envelope-wrapper.open .letter { opacity: 1; transform: scale(1); z-index: 20; pointer-events: auto; }
        .envelope-wrapper.open .tap-hint { display: none; }

        /* ป๊อปอัปแจ้งเตือน / แสดง QR Code */
        #qr-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center;
        }
        .qr-modal-content {
            background: white; padding: 25px; border-radius: 15px; text-align: center; width: 90%; max-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" onclick="this.classList.toggle('open')">
        <div class="envelope-back"></div>
        <div class="flap-left paper-texture"></div>
        <div class="flap-right paper-texture"></div>
        <div class="flap-bottom paper-texture"></div>
        
        <div class="bottom-text">"A night to remember, a celebration to share."</div>

        <div class="flap-top paper-texture">
            <div class="top-text">
                <div class="envelope-title">งานเลี้ยงสังสรรค์</div>
                <div class="envelope-subtitle">28 พฤศจิกายน 2569</div>
            </div>
        </div>

        <div class="wax-seal">♥</div>

        <!-- หน้ากระดาษเมื่อเปิดซอง -->
        <div class="letter" onclick="event.stopPropagation();">
            <h2>งานเลี้ยงสังสรรค์ ประจำปี 2569</h2>
            <div class="letter-content">
                เรียน <strong>พนักงาน CLT</strong>,<br>
                กรอกรหัสพนักงานเพื่อแสดงบัตร QR Code สำหรับเข้างาน:<br>
                <input type="text" id="checkId" placeholder="รหัสพนักงาน (เช่น EMP01)">
            </div>
            <div>
                <button class="btn-action" onclick="showMyQRCode()">🎟️ แสดง QR Code ของฉัน</button>
            </div>
        </div>

        <div class="tap-hint">👆 แตะที่ซองจดหมายเพื่อเปิด</div>
    </div>

    <!-- หน้าต่างป๊อปอัป -->
    <div id="qr-modal">
        <div class="qr-modal-content">
            <h3 id="modal-title" style="color: #7b1113; margin-top: 0;">🎟️ บัตรเข้างานของคุณ</h3>
            <div id="personal-qrcode" style="display: flex; justify-content: center; margin: 15px 0; position: relative;"></div>
            <div id="personal-info" style="font-size: 14px; color: #333; margin-bottom: 15px;"></div>
            <button class="btn-action" onclick="closeModal()" style="background: #666;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        function encodeThaiToBase64(id, name, branch) {
            const rawText = `${id}|${name}|${branch}`;
            return btoa(unescape(encodeURIComponent(rawText)));
        }

        function showMyQRCode() {
            const empId = document.getElementById('checkId').value.trim();
            if(!empId) {
                alert("กรุณากรอกรหัสพนักงานก่อนครับ");
                return;
            }

            const storedExcel = localStorage.getItem('partyExcelData');
            let found = false;
            let empName = "";
            let empBranch = "";

            // ตรวจสอบว่ามีข้อมูลใน Excel หรือไม่ และรหัสตรงกันไหม
            if (storedExcel) {
                const json = JSON.parse(storedExcel);
                for (let i = 1; i < json.length; i++) {
                    const row = json[i];
                    if (row && row[0] && row[0].toString().trim().toLowerCase() === empId.toLowerCase()) {
                        found = true;
                        empName = row[1] ? row[1].toString().trim() : "พนักงาน CLT";
                        empBranch = row[2] ? row[2].toString().trim() : "ไม่ระบุสาขา";
                        break;
                    }
                }
            }

            const qrContainer = document.getElementById("personal-qrcode");
            const infoContainer = document.getElementById("personal-info");
            const modalTitle = document.getElementById("modal-title");
            qrContainer.innerHTML = "";

            if (!found) {
                // กรณีไม่พบข้อมูลใน Excel
                modalTitle.innerText = "❌ ไม่พบข้อมูล";
                qrContainer.innerHTML = "";
                infoContainer.innerHTML = `ไม่พบรหัสพนักงาน <b>"${empId}"</b> ในระบบ<br><br><span style="color: red; font-weight: bold;">กรุณาติดต่อเจ้าหน้าที่</span>`;
            } else {
                // กรณีพบข้อมูล แสดง QR Code ปกติ
                modalTitle.innerText = "🎟️ บัตรเข้างานของคุณ";
                const encodedData = encodeThaiToBase64(empId, empName, empBranch);
                
                new QRCode(qrContainer, { 
                    text: `VIPPARTY|${encodedData}`, 
                    width: 180, height: 180,
                    correctLevel : QRCode.CorrectLevel.H 
                });

                infoContainer.innerHTML = `<b>รหัส:</b> ${empId}<br><b>ชื่อ:</b> ${empName}<br><b>สาขา:</b> ${empBranch}`;
            }

            document.getElementById("qr-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("qr-modal").style.display = "none";
        }
    </script>
</body>
</html>
