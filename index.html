<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การ์ดเชิญงานเลี้ยงสังสรรค์ 2569</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: url('https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden; font-family: 'Prompt', sans-serif;
        }
        body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.55); z-index: -1; }
        .envelope-wrapper { position: relative; width: 90%; max-width: 360px; height: 240px; cursor: pointer; }
        .envelope-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #d8c8af; box-shadow: 0 15px 35px rgba(0,0,0,0.6); z-index: 1; }
        .paper-texture { background: linear-gradient(135deg, #f9f5ec 0%, #eaddc4 100%); }
        .letter {
            position: absolute; top: -110px; left: 2.5%; width: 95%; height: 440px;
            background: #fffdf7; box-shadow: 0 15px 40px rgba(0,0,0,0.5); z-index: 0;
            padding: 20px; box-sizing: border-box; text-align: center; color: #333; border-radius: 6px;
            opacity: 0; transform: scale(0.5); pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .flap-left { position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: polygon(0 0, 50% 50%, 0 100%); z-index: 3; pointer-events: none; }
        .flap-right { position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: polygon(100% 0, 50% 50%, 100% 100%); z-index: 3; pointer-events: none; }
        .flap-bottom { position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: polygon(0 100%, 50% 45%, 100% 100%); z-index: 4; pointer-events: none; }
        .bottom-text { position: absolute; bottom: 25px; width: 100%; text-align: center; font-family: 'Cinzel', serif; font-style: italic; font-size: 11px; color: #7b1113; z-index: 5; pointer-events: none; }
        .flap-top { position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: polygon(0 0, 100% 0, 50% 60%); z-index: 6; transform-origin: top; transition: transform 0.5s ease-in-out; }
        .top-text { padding-top: 30px; text-align: center; }
        .envelope-title { font-family: 'Cinzel', serif; font-size: 20px; color: #7b1113; font-weight: 700; margin-bottom: 2px; }
        .wax-seal { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: radial-gradient(circle, #aa1318 0%, #5e080b 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #5a070c; font-size: 24px; z-index: 7; }
        .tap-hint { position: absolute; bottom: -35px; width: 100%; text-align: center; color: #fff; font-size: 13px; }
        .letter h2 { font-family: 'Cinzel', serif; color: #7b1113; margin: 0 0 5px 0; border-bottom: 1px solid #eaddc4; padding-bottom: 5px; font-size: 16px; }
        input[type="text"] { width: 100%; padding: 8px; margin: 5px 0 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: 'Prompt', sans-serif; box-sizing: border-box; }
        .btn-action { display: block; background: #7b1113; color: #fffdf7; padding: 10px 0; border-radius: 4px; font-size: 14px; font-weight: 600; text-align: center; cursor: pointer; border: none; width: 100%; }
        .envelope-wrapper.open .flap-top { transform: rotateX(180deg); z-index: 1; }
        .envelope-wrapper.open .wax-seal { opacity: 0; }
        .envelope-wrapper.open .letter { opacity: 1; transform: scale(1); z-index: 20; pointer-events: auto; }
        .envelope-wrapper.open .tap-hint { display: none; }
        #qr-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; }
        .qr-modal-content { background: white; padding: 25px; border-radius: 15px; text-align: center; width: 90%; max-width: 320px; }
    </style>
</head>
<body>

    <div class="envelope-wrapper" onclick="this.classList.toggle('open')">
        <div class="envelope-back"></div>
        <div class="flap-left paper-texture"></div>
        <div class="flap-right paper-texture"></div>
        <div class="flap-bottom paper-texture"></div>
        <div class="bottom-text">"A night to remember, a celebration to share."</div>

        <div class="flap-top paper-texture">
            <div class="top-text">
                <div class="envelope-title">งานเลี้ยงสังสรรค์</div>
                <div style="font-size:11px; color:#7b1113;">28 พฤศจิกายน 2569</div>
            </div>
        </div>

        <div class="wax-seal">♥</div>

        <div class="letter" onclick="event.stopPropagation();">
            <h2>งานเลี้ยงสังสรรค์ ประจำปี 2569</h2>
            <div style="font-size:12px; text-align:left; color:#444;">
                เรียน <strong>พนักงาน CLT</strong>,<br>
                กรอกรหัสพนักงานเพื่อแสดงบัตร QR Code สำหรับเข้างาน:<br>
                <input type="text" id="checkId" placeholder="รหัสพนักงาน (เช่น 083354)">
            </div>
            <div>
                <button class="btn-action" onclick="showMyQRCode()">🎟️ แสดง QR Code ของฉัน</button>
            </div>
        </div>

        <div class="tap-hint">👆 แตะที่ซองจดหมายเพื่อเปิด</div>
    </div>

    <div id="qr-modal">
        <div class="qr-modal-content">
            <h3 id="modal-title" style="color: #7b1113; margin-top: 0;">🎟️ บัตรเข้างานของคุณ</h3>
            <div id="personal-qrcode" style="display: flex; justify-content: center; margin: 15px 0;"></div>
            <div id="personal-info" style="font-size: 14px; color: #333; margin-bottom: 15px;"></div>
            <button class="btn-action" onclick="closeModal()" style="background: #666;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxwf4GF2ebnkN_qg6T8C3pfF9k0PTqUDLFAHWywGHhRm1OQffUMtHIEsKBu0Qci9yv_Zg/exec";
        let cachedGuests = [];

        // ฟังก์ชันจัดรูปแบบรหัส: ถ้าเป็นตัวเลขล้วนให้เติม 0 ข้างหน้าให้ครบ 6 หลัก
        function formatEmpId(val) {
            if (!val) return "";
            let str = val.toString().trim();
            if (/^\d+$/.test(str) && str.length < 6) {
                str = str.padStart(6, '0');
            }
            return str;
        }

        window.addEventListener('DOMContentLoaded', () => {
            // โหลดจาก LocalStorage สำรอง
            const stored = localStorage.getItem('partyExcelData');
            if (stored) {
                try {
                    const json = JSON.parse(stored);
                    for (let i = 1; i < json.length; i++) {
                        if (json[i] && json[i][0]) {
                            cachedGuests.push({
                                id: formatEmpId(json[i][0]),
                                name: json[i][1] ? json[i][1].toString().trim() : "",
                                branch: json[i][2] ? json[i][2].toString().trim() : ""
                            });
                        }
                    }
                } catch(e) {}
            }

            // ดึงข้อมูลจาก Google Sheets
            fetch(scriptUrl + "?action=getGuests&t=" + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success" && data.guests.length > 0) {
                        cachedGuests = data.guests.map(g => ({
                            id: formatEmpId(g.id),
                            name: g.name,
                            branch: g.branch
                        }));
                    }
                })
                .catch(err => console.log("โหลดรายชื่อออนไลน์ไม่สำเร็จ ใช้ข้อมูลในเครื่อง"));
        });

        function showMyQRCode() {
            const rawEmpId = document.getElementById('checkId').value.trim();
            if(!rawEmpId) { 
                alert("กรุณากรอกรหัสพนักงานก่อนครับ"); 
                return; 
            }

            const searchId = formatEmpId(rawEmpId); // จัดรูปแบบให้คงเลข 0 เช่น 083354

            const qrContainer = document.getElementById("personal-qrcode");
            const infoContainer = document.getElementById("personal-info");
            const modalTitle = document.getElementById("modal-title");
            qrContainer.innerHTML = "";

            // ค้นหารหัสพนักงานที่ตรงกัน
            const guest = cachedGuests.find(g => formatEmpId(g.id).toLowerCase() === searchId.toLowerCase());

            if (!guest) {
                modalTitle.innerText = "❌ ไม่พบข้อมูล";
                infoContainer.innerHTML = `ไม่พบรหัสพนักงาน <b>"${searchId}"</b> ในระบบ<br><br><span style="color: red; font-weight: bold;">กรุณาติดต่อเจ้าหน้าที่</span>`;
            } else {
                modalTitle.innerText = "🎟️ บัตรเข้างานของคุณ";
                const displayId = formatEmpId(guest.id);
                const encodedData = btoa(unescape(encodeURIComponent(`${displayId}|${guest.name}|${guest.branch}`)));
                
                new QRCode(qrContainer, { 
                    text: `VIPPARTY|${encodedData}`, 
                    width: 180, height: 180, 
                    correctLevel : QRCode.CorrectLevel.H 
                });

                infoContainer.innerHTML = `<b>รหัส:</b> ${displayId}<br><b>ชื่อ:</b> ${guest.name}<br><b>สาขา:</b> ${guest.branch}`;
            }

            document.getElementById("qr-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("qr-modal").style.display = "none";
        }
    </script>
</body>
</html>
