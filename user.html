<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Connect - ระบบต้อนรับหน้างาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root { --primary: #4A00E0; }
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #4A00E0 0%, #8E2DE2 100%); color: #333; margin: 0; padding: 0; min-height: 100vh; }
        .header { text-align: center; padding: 30px 10px 10px; color: white; position: relative; }
        .header h1 { margin: 0; font-size: 32px; }
        .back-home { position: absolute; left: 20px; top: 20px; background: rgba(255,255,255,0.2); color: white; padding: 6px 15px; border-radius: 20px; text-decoration: none; font-size: 14px; border: 1px solid rgba(255,255,255,0.4); }
        .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 20px; }
        .tab-btn { background: rgba(255, 255, 255, 0.2); color: white; border: 2px solid white; padding: 12px 25px; border-radius: 30px; cursor: pointer; font-size: 16px; font-weight: 600; }
        .tab-btn.active { background: white; color: var(--primary); }
        .container { max-width: 900px; margin: 0 auto 40px; padding: 0 20px; }
        .tab-content { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 30px; display: none; }
        .tab-content.active { display: block; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin: 10px 0 20px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .action-btn { background: linear-gradient(135deg, #4A00E0 0%, #8E2DE2 100%); color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; cursor: pointer; font-weight: bold; width: 100%; box-sizing: border-box; }
        .action-btn.print-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); margin-bottom: 10px; }
        #reader { width: 100%; max-width: 450px; margin: 0 auto 20px; border-radius: 10px; overflow: hidden; background: #fff;}
        #hardwareInput { font-size: 18px; text-align: center; font-weight: bold; padding: 15px; border: 2px solid #8E2DE2; width: 100%; box-sizing: border-box;}
        #result { margin-top: 20px; font-size: 22px; font-weight: bold; padding: 20px; border-radius: 10px; background: #eee; text-align: center; }
        .stat-grid { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
        .stat-box { background: white; border-radius: 15px; padding: 20px; text-align: center; border: 2px solid #eee; flex: 1; min-width: 140px; }
        .stat-number { font-size: 45px; font-weight: bold; margin: 0; }
        .text-blue { color: #007bff; } .text-green { color: #00C851; } .text-red { color: #ff4444; }
        .recent-list { list-style: none; padding: 0; margin-top: 20px; max-height: 350px; overflow-y: auto; }
        .recent-list li { background: white; padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #00C851; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-home">⬅️ กลับหน้าการ์ดเชิญ</a>
        <h1>✨ VIP Party Connect</h1>
        <p>ระบบต้อนรับและลงทะเบียนเข้างาน (Admin)</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('bulk', this)">📊 อัปโหลด Excel เข้าระบบ</button>
        <button class="tab-btn" onclick="switchTab('scanner', this)">📸 จุดสแกนเข้างาน</button>
        <button class="tab-btn" onclick="switchTab('dashboard', this)">📈 สถิติเข้างาน</button>
    </div>

    <div class="container">
        <!-- แท็บ 1: อัปโหลด Excel -->
        <div id="tab-bulk" class="tab-content active">
            <h2 style="color: var(--primary); text-align: center;">นำเข้ารายชื่อพนักงานจาก Excel ไปยังระบบกลาง</h2>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
            <div id="uploadStatus" style="text-align: center; font-weight: bold; margin: 10px 0;"></div>
            <button class="action-btn print-btn" onclick="window.print()">🖨️ สั่งปริ้น QR Code แยกสาขา</button>
            <div id="qrContainer" style="margin-top: 20px;"></div>
        </div>

        <!-- แท็บ 2: สแกน -->
        <div id="tab-scanner" class="tab-content">
            <h2 style="color: var(--primary); text-align: center;">จุดสแกนรับแขกหน้างาน</h2>
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
                <button class="action-btn" onclick="chooseScannerMode('camera')" style="width: auto;">📸 ใช้กล้อง</button>
                <button class="action-btn" onclick="chooseScannerMode('hardware')" style="width: auto; background: #333;">🔫 ใช้เครื่องยิงบาร์โค้ด</button>
            </div>
            <div id="camera-section" style="display: none;"><div id="reader"></div></div>
            <div id="hardware-section" style="display: none; text-align: center;">
                <input type="text" id="hardwareInput" placeholder="[ ยิงคิวอาร์โค้ดที่นี่ ]" autocomplete="off">
            </div>
            <div id="result">🟢 กรุณาเลือกโหมดสแกน...</div>
        </div>

        <!-- แท็บ 3: Dashboard -->
        <div id="tab-dashboard" class="tab-content">
            <h2 style="color: var(--primary); text-align: center;">สถิติผู้เข้างาน Real-time</h2>
            <div class="stat-grid">
                <div class="stat-box"><h3>จำนวนรวมทั้งหมด</h3><p class="stat-number text-blue" id="stat-total">0</p></div>
                <div class="stat-box"><h3>สแกนแล้ว</h3><p class="stat-number text-green" id="stat-checked">0</p></div>
                <div class="stat-box"><h3>ยังไม่มา</h3><p class="stat-number text-red" id="stat-absent">0</p></div>
            </div>
            <h4>รายชื่อผู้เข้างานล่าสุด</h4>
            <ul class="recent-list" id="recent-scans"></ul>
        </div>
    </div>

    <script>
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxwf4GF2ebnkN_qg6T8C3pfF9k0PTqUDLFAHWywGHhRm1OQffUMtHIEsKBu0Qci9yv_Zg/exec";
        let cameraInitialized = false;
        let statsInterval;
        let isProcessing = false;

        window.addEventListener('DOMContentLoaded', () => {
            const pass = prompt("🔐 กรุณาใส่รหัสผ่านผู้ดูแลระบบ:");
            if (pass !== "9999") {
                alert("รหัสผ่านไม่ถูกต้อง!");
                window.location.href = "index.html";
            }
        });

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btnElement.classList.add('active');
            clearInterval(statsInterval);
            if (tabId === 'dashboard') {
                fetchStats();
                statsInterval = setInterval(fetchStats, 5000);
            }
        }

        // อัปโหลดไฟล์ Excel แล้วบันทึกลง Google Sheets ทันที
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.innerHTML = "⏳ กำลังส่งข้อมูลไปยัง Google Sheets...";

            const reader = new FileReader();
            reader.onload = function(e) {
                const workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});

                fetch(scriptUrl, {
                    method: "POST",
                    body: JSON.stringify({ guests: json })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        statusDiv.innerHTML = `✅ อัปโหลดสำเร็จ! ข้อมูลถูกบันทึกลงระบบกลางจำนวน ${data.count} คน`;
                    }
                })
                .catch(err => {
                    statusDiv.innerHTML = "❌ การเชื่อมต่อล้มเหลว กรุณาลองใหม่อีกครั้ง";
                });
            };
            reader.readAsArrayBuffer(file);
        });

        function fetchStats() {
            fetch(scriptUrl + "?action=getStats&t=" + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        document.getElementById('stat-total').innerText = data.total;
                        document.getElementById('stat-checked').innerText = data.checkedIn;
                        document.getElementById('stat-absent').innerText = Math.max(0, data.total - data.checkedIn);
                        
                        const list = document.getElementById('recent-scans');
                        list.innerHTML = "";
                        data.recent.forEach(emp => {
                            const li = document.createElement('li');
                            li.innerHTML = `<b>${emp.name}</b> (${emp.branch})`;
                            list.appendChild(li);
                        });
                    }
                });
        }

        function chooseScannerMode(mode) {
            document.getElementById('camera-section').style.display = mode === 'camera' ? 'block' : 'none';
            document.getElementById('hardware-section').style.display = mode === 'hardware' ? 'block' : 'none';
            if (mode === 'camera' && !cameraInitialized) {
                new Html5Qrcode("reader").start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (text) => processQR(text));
                cameraInitialized = true;
            }
            if (mode === 'hardware') document.getElementById('hardwareInput').focus();
        }

        function processQR(text) {
            if (isProcessing || !text.startsWith("VIPPARTY|")) return;
            isProcessing = true;
            const raw = decodeURIComponent(escape(atob(text.split("|")[1])));
            const parts = raw.split("|");
            
            fetch(`${scriptUrl}?id=${encodeURIComponent(parts[0])}&name=${encodeURIComponent(parts[1])}&branch=${encodeURIComponent(parts[2])}`)
                .then(res => res.json())
                .then(data => {
                    const resDiv = document.getElementById('result');
                    if (data.status === "success") {
                        resDiv.innerHTML = `✅ ยินดีต้อนรับ: ${parts[1]} (${parts[2]})`;
                        resDiv.style.background = "#00C851"; resDiv.style.color = "white";
                    } else {
                        resDiv.innerHTML = `⚠️ ข้อมูลซ้ำ! รหัสนี้เข้างานไปแล้ว (${parts[1]})`;
                        resDiv.style.background = "#ff5722"; resDiv.style.color = "white";
                    }
                })
                .finally(() => setTimeout(() => { isProcessing = false; }, 3000));
        }

        document.getElementById('hardwareInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { processQR(this.value.trim()); this.value = ''; }
        });
    </script>
</body>
</html>
